[workspace]
resolver = "3"
members = ["xor", "mnist", "dataset", "intent", "agent"]

# Stage 4 of the learning plan: small, fast, single-file release binaries.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Stage 4: the shipped `cyore` binary is built with this profile (`make release`,
# `make cross-arm64`, release workflow). opt-level "z" made it 41% smaller (4.20 → 2.46 MiB)
# with the same speed and output; training (`intent`, `mnist`) keeps opt-level 3 in `release`.
[profile.dist]
inherits = "release"
opt-level = "z"
