[package]
name = "intent"
version = "0.1.0"
edition = "2024"

# Stage 2: the first crate that uses an ML framework. Burn is pinned and trimmed to the features
# we use: the pure-Rust CPU backend (`flex`), autodiff + optimizers (`optim`) and weight files
# (`store`). No GPU backends, no training dashboard. See the add-intent-model design.
[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "flex", "optim", "store"] }
dataset = { path = "../dataset" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
