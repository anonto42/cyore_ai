name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  # Binaries shipped in every archive, as package:binary:profile. The agent package builds
  # `cyore` with the size-optimised `dist` profile (root Cargo.toml). Add an entry per milestone.
  BINS: xor:xor:release mnist:mnist:release agent:cyore:dist

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml, plus this job's target
      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version

      # musl targets produce fully static Linux binaries (same as the Dockerfile)
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Run tests
        run: cargo test --workspace --locked

      # Stage 4: cyore embeds the int8 model at build time (agent/build.rs), so produce it first.
      # Seeded dataset + training, so every release is reproducible from source.
      - name: Train and quantize the model
        shell: bash
        run: |
          cargo run --release --locked -p dataset
          cargo run --release --locked -p intent -- train
          cargo run --release --locked -p intent -- quantize

      - name: Build release binaries
        shell: bash
        run: |
          for entry in $BINS; do
            IFS=: read -r package bin profile <<< "$entry"
            cargo build --profile "$profile" --locked --target "$TARGET" -p "$package"
          done

      - name: Package binaries
        shell: bash
        run: |
          name="cyore-${GITHUB_REF_NAME}-${TARGET}"
          ext=""
          if [[ "$TARGET" == *windows* ]]; then ext=".exe"; fi
          mkdir -p "dist/$name"
          for entry in $BINS; do
            IFS=: read -r package bin profile <<< "$entry"
            cp "target/$TARGET/$profile/$bin$ext" "dist/$name/"
          done
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [[ -n "$ext" ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          ls -lh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
